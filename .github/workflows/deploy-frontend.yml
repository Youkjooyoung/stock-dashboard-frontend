name: Frontend Auto Deploy

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2 (jyyouk.shop)
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.EC2_FRONTEND_HOST }}
          DEPLOY_USER: ${{ secrets.EC2_FRONTEND_USER }}
          DEPLOY_KEY: ${{ secrets.EC2_SSH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Missing EC2_FRONTEND_HOST secret}"
          : "${DEPLOY_USER:?Missing EC2_FRONTEND_USER secret}"
          : "${DEPLOY_KEY:?Missing EC2_SSH_KEY secret}"

      - name: Download verified frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-${{ github.event.workflow_run.head_sha }}
          path: deploy-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate downloaded bundle
        run: test -s deploy-artifact/frontend-dist.tar.gz

      - name: Upload bundle to EC2 staging directory
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_FRONTEND_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: deploy-artifact/frontend-dist.tar.gz
          target: ~/stock-dashboard-frontend-deploy/${{ env.DEPLOY_SHA }}
          strip_components: 1
          timeout: 30s
          command_timeout: 3m

      - name: Activate frontend release and verify health
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
        with:
          host: ${{ secrets.EC2_FRONTEND_HOST }}
          username: ${{ secrets.EC2_FRONTEND_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 30s
          command_timeout: 5m
          envs: DEPLOY_SHA
          script: |
            set -Eeuo pipefail

            deploy_root="$HOME/stock-dashboard-frontend-deploy"
            archive="$deploy_root/$DEPLOY_SHA/frontend-dist.tar.gz"
            release_root="/var/www/stock-dashboard-releases"
            release_dir="$release_root/$DEPLOY_SHA"
            current_path="/var/www/stock-dashboard"
            next_link="${current_path}.next"
            previous_release=""

            test -s "$archive"
            sudo mkdir -p "$release_dir"
            sudo tar -xzf "$archive" -C "$release_dir"
            sudo test -s "$release_dir/index.html"
            sudo nginx -t

            if [ -L "$current_path" ]; then
              previous_release="$(readlink -f "$current_path")"
            elif [ -d "$current_path" ]; then
              previous_release="$release_root/legacy-$(date -u +%Y%m%d%H%M%S)"
              sudo mv "$current_path" "$previous_release"
            elif [ -e "$current_path" ]; then
              echo "$current_path exists but is not a directory or symlink."
              exit 1
            fi

            sudo ln -sfn "$release_dir" "$next_link"
            sudo mv -Tf "$next_link" "$current_path"
            sudo systemctl reload nginx

            health_ok() {
              curl -kfsS --max-time 10 \
                --resolve jyyouk.shop:443:127.0.0.1 \
                https://jyyouk.shop/ \
                -o /dev/null
            }

            if health_ok; then
              echo "Frontend health check passed."
              rm -f "$archive"
              rmdir "$deploy_root/$DEPLOY_SHA" 2>/dev/null || true
              exit 0
            fi

            echo "Frontend health check failed; attempting rollback."
            if [ -n "$previous_release" ] && [ -d "$previous_release" ]; then
              sudo ln -sfn "$previous_release" "$next_link"
              sudo mv -Tf "$next_link" "$current_path"
              sudo nginx -t
              sudo systemctl reload nginx

              if health_ok; then
                echo "Rollback completed successfully."
                exit 1
              fi
            fi

            echo "Rollback failed or no previous release was available."
            exit 1

      - name: Verify public frontend endpoint
        run: curl -fsS --max-time 15 https://jyyouk.shop/ -o /dev/null
