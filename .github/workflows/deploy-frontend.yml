name: Frontend Auto Deploy

on:
  workflow_run:
    workflows: [Frontend CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to S3 and CloudFront (jyyouk.store)
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      AWS_REGION: ap-northeast-2
      AWS_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      FRONTEND_BUCKET: ${{ vars.AWS_FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      CLOUDFRONT_DOMAIN_NAME: ${{ vars.CLOUDFRONT_DOMAIN_NAME }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${AWS_ROLE_ARN:?Missing AWS_DEPLOY_ROLE_ARN repository variable}"
          : "${FRONTEND_BUCKET:?Missing AWS_FRONTEND_BUCKET repository variable}"
          : "${CLOUDFRONT_DISTRIBUTION_ID:?Missing CLOUDFRONT_DISTRIBUTION_ID repository variable}"
          : "${CLOUDFRONT_DOMAIN_NAME:?Missing CLOUDFRONT_DOMAIN_NAME repository variable}"

      - name: Download verified frontend bundle
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist-${{ github.event.workflow_run.head_sha }}
          path: deploy-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Validate downloaded bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s deploy-artifact/frontend-dist.tar.gz
          mkdir -p deploy-artifact/dist
          tar -xzf deploy-artifact/frontend-dist.tar.gz -C deploy-artifact/dist
          test -s deploy-artifact/dist/index.html

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: stock-frontend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Publish verified frontend bundle
        shell: bash
        run: |
          set -Eeuo pipefail

          aws s3 sync deploy-artifact/dist "s3://${FRONTEND_BUCKET}" \
            --delete \
            --cache-control "public,max-age=300"

          aws s3 cp deploy-artifact/dist/index.html \
            "s3://${FRONTEND_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-store,no-cache,must-revalidate" \
            --metadata-directive REPLACE

          if [ -d deploy-artifact/dist/assets ]; then
            aws s3 sync deploy-artifact/dist/assets \
              "s3://${FRONTEND_BUCKET}/assets" \
              --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Invalidate and verify CloudFront
        shell: bash
        run: |
          set -Eeuo pipefail
          invalidation_id="$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths '/*' \
            --query 'Invalidation.Id' \
            --output text)"

          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${invalidation_id}"

          curl -fsS --retry 5 --retry-delay 5 --max-time 20 \
            "https://${CLOUDFRONT_DOMAIN_NAME}/" \
            -o /dev/null

          curl -fsS --retry 5 --retry-delay 5 --max-time 20 \
            "https://${CLOUDFRONT_DOMAIN_NAME}/login" \
            -o /dev/null

      - name: Verify public frontend endpoint
        run: curl -fsS --max-time 15 https://jyyouk.store/ -o /dev/null
