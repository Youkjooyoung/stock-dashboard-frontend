name: Frontend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint, Test & Build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:run

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.jyyouk.shop
          VITE_PORTONE_IMP_KEY: ${{ secrets.VITE_PORTONE_IMP_KEY }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

      - name: Package deployable bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s dist/index.html
          tar -czf frontend-dist.tar.gz -C dist .
          test -s frontend-dist.tar.gz

      - name: Upload deployable bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: frontend-dist.tar.gz
          if-no-files-found: error
          retention-days: 7
