AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 and CloudFront hosting for the stock-dashboard frontend.

Parameters:
  DomainName:
    Type: String
    Default: jyyouk.store
    Description: Frontend custom domain.
  AlternateDomainName:
    Type: String
    Default: ''
    Description: Optional second alias kept during a domain migration. CertificateArn must cover it.
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:us-east-1:[0-9]{12}:certificate/.+$'
    ConstraintDescription: CloudFront requires an ACM certificate issued in us-east-1.
  WebAclArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:wafv2:us-east-1:[0-9]{12}:global/webacl/.+$'
    ConstraintDescription: The CloudFront pricing-plan Web ACL must use global scope in us-east-1.
    Description: Web ACL created when the distribution joins a CloudFront flat-rate plan.
  GitHubRepository:
    Type: String
    Default: Youkjooyoung/stock-dashboard-frontend
    AllowedPattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: GitHub owner/repository allowed to deploy from the main branch.

Conditions:
  HasWebAcl: !Not [!Equals [!Ref WebAclArn, '']]
  HasAlternate: !Not [!Equals [!Ref AlternateDomainName, '']]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: RemoveOldObjectVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 14
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: stock-dashboard
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Access control for the private stock-dashboard frontend bucket
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendSpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite extensionless frontend routes to index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;

          if (uri.endsWith('/')) {
            request.uri = uri + 'index.html';
          } else if (!uri.split('/').pop().includes('.')) {
            request.uri = '/index.html';
          }

          return request;
        }
      Name: !Sub '${AWS::StackName}-spa-rewrite'

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
          - !If [HasAlternate, !Ref AlternateDomainName, !Ref 'AWS::NoValue']
        Comment: Stock Dashboard frontend
        CustomErrorResponses:
          - ErrorCachingMinTTL: 0
            ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCachingMinTTL: 0
            ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt FrontendSpaRewriteFunction.FunctionARN
          # AWS managed SecurityHeadersPolicy. Managed policies are compatible
          # with the CloudFront Free flat-rate plan; custom policies are not.
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
          TargetOriginId: frontend-s3-origin
          ViewerProtocolPolicy: redirect-to-https
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - DomainName: !GetAtt FrontendBucket.RegionalDomainName
            Id: frontend-s3-origin
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        WebACLId: !If [HasWebAcl, !Ref WebAclArn, !Ref 'AWS::NoValue']
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only
      Tags:
        - Key: Project
          Value: stock-dashboard
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      Tags:
        - Key: Project
          Value: stock-dashboard
        - Key: ManagedBy
          Value: CloudFormation

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege role used by GitHub Actions to deploy the frontend.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
                  - !Sub 'repo:Youkjooyoung@*/stock-dashboard-frontend@*:ref:refs/heads/main'
      Policies:
        - PolicyName: DeployFrontend
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadBucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt FrontendBucket.Arn
              - Sid: PublishFrontendAssets
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub '${FrontendBucket.Arn}/*'
              - Sid: InvalidateFrontendCache
                Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
      Tags:
        - Key: Project
          Value: stock-dashboard
        - Key: Environment
          Value: production
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  BucketName:
    Description: Private S3 deployment bucket.
    Value: !Ref FrontendBucket
  DistributionId:
    Description: CloudFront distribution ID.
    Value: !Ref FrontendDistribution
  DistributionDomainName:
    Description: CloudFront-generated domain used for pre-DNS validation.
    Value: !GetAtt FrontendDistribution.DomainName
  DeployRoleArn:
    Description: Set this as the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt GitHubDeployRole.Arn
